services:
  mc:
    # make sure this java version matches with pack java version
    image: itzg/minecraft-server:java21-alpine
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: true
      TYPE: CUSTOM
      # Download the server file and place it in modpacks folder, adjust filename if necessary. 
      GENERIC_PACK: /modpacks/GT_New_Horizons_2.7.2_Server_Java_17-21.zip
      # We can't use the updater as it overrides all files contained in the server archive, which for GTNH includes a few config files like whitelist and ops.
      SKIP_GENERIC_PACK_UPDATE_CHECK: true
      JVM_OPTS: "-Dfml.readTimeout=180 @java9args.txt"
      CUSTOM_SERVER: "lwjgl3ify-forgePatches.jar"
      MEMORY: 6G
    volumes:
      - mc-data:/data
      - ./modpacks:/modpacks:ro
volumes:
  mc-data:
